name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Linting & Code Quality
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pylint black isort mypy
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Check code formatting with Black
      run: |
        black --check --diff app/ tests/ || echo "::warning::Black formatting issues found"
      continue-on-error: true

    - name: Check import sorting with isort
      run: |
        isort --check-only --diff app/ tests/ || echo "::warning::Import sorting issues found"
      continue-on-error: true

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 app/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 app/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Lint with pylint
      run: |
        pylint app/ --exit-zero --max-line-length=127 --disable=C0111,R0913,R0914,R0915 || true
      continue-on-error: true

    - name: Type check with mypy
      run: |
        mypy app/ --ignore-missing-imports --no-strict-optional || echo "::warning::Type checking issues found"
      continue-on-error: true

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-xdist pytest-timeout
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Download SpaCy models
      run: |
        python -m spacy download en_core_web_sm || true
      continue-on-error: true

    - name: Run unit tests
      run: |
        pytest tests/unit/ -v --tb=short --timeout=300
      timeout-minutes: 10

    - name: Run integration tests
      run: |
        pytest tests/integration/ -v --tb=short --timeout=600
      timeout-minutes: 15

    - name: Run evaluation tests
      run: |
        pytest test_evaluation.py -v --tb=short --timeout=300
      timeout-minutes: 10

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov coverage
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Download SpaCy models
      run: |
        python -m spacy download en_core_web_sm || true
      continue-on-error: true

    - name: Run tests with coverage
      run: |
        pytest tests/ --cov=app --cov-report=xml --cov-report=html --cov-report=term-missing
      continue-on-error: true

    - name: Generate coverage report
      run: |
        coverage report -m

    - name: Upload coverage to artifacts
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: htmlcov/

    - name: Coverage comment
      run: |
        echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
        coverage report -m >> $GITHUB_STEP_SUMMARY

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Check if Dockerfile exists
      id: dockerfile-check
      run: |
        if [ -f Dockerfile ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "::warning::Dockerfile not found, skipping Docker build"
        fi

    - name: Build Docker image
      if: steps.dockerfile-check.outputs.exists == 'true'
      run: |
        docker build -t pii-redaction-tool:test .

    - name: Test Docker image
      if: steps.dockerfile-check.outputs.exists == 'true'
      run: |
        docker run --rm pii-redaction-tool:test python --version

    - name: Check Docker image size
      if: steps.dockerfile-check.outputs.exists == 'true'
      run: |
        docker images pii-redaction-tool:test --format "{{.Size}}"

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit

    - name: Run safety check
      run: |
        if [ -f requirements.txt ]; then
          safety check -r requirements.txt --exit-zero || echo "::warning::Security vulnerabilities found"
        fi
      continue-on-error: true

    - name: Run bandit security scan
      run: |
        bandit -r app/ -f json -o bandit-report.json --exit-zero || true
        bandit -r app/ --skip B101 --exit-zero || echo "::warning::Security issues found"
      continue-on-error: true

    - name: Upload security reports
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: bandit-report.json
      if: always()

  status:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [lint, test, coverage, docker, security]
    if: always()

    steps:
    - name: Check CI results
      run: |
        echo "## CI Pipeline Status" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- Linting: ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Tests: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Coverage: ${{ needs.coverage.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Docker: ${{ needs.docker.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Security: ${{ needs.security.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ "${{ needs.test.result }}" == "failure" ]; then
          echo "::error::Tests failed"
          exit 1
        fi

        echo "✅ CI Pipeline completed"
