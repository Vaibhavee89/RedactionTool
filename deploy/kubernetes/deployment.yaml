# ============================================================================
# Kubernetes Deployment for RedactionTool
# Includes: UI, API, Redis, ConfigMap, Secrets
# ============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: redaction-tool

---
# ============================================================================
# ConfigMap - Application Configuration
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: redaction-config
  namespace: redaction-tool
data:
  APP_NAME: "RedactionTool"
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  STREAMLIT_SERVER_PORT: "8501"
  API_PORT: "8000"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  MAX_WORKERS: "4"
  BATCH_SIZE: "100"
  CACHE_ENABLED: "true"
  ENABLE_AUDIT_LOG: "true"
  HASH_DOCUMENTS: "true"
  RETENTION_DAYS: "90"

---
# ============================================================================
# Secret - Sensitive Configuration
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: redaction-secrets
  namespace: redaction-tool
type: Opaque
stringData:
  API_KEY: "change-this-api-key-in-production"
  REDIS_PASSWORD: ""

---
# ============================================================================
# PersistentVolumeClaim - Shared Storage
# ============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redaction-data-pvc
  namespace: redaction-tool
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard

---
# ============================================================================
# Redis Deployment
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: redaction-tool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: redaction-tool
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
  type: ClusterIP

---
# ============================================================================
# UI Deployment (Streamlit)
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: redaction-tool
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
      - name: ui
        image: redaction-tool:ui-latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8501
        envFrom:
        - configMapRef:
            name: redaction-config
        - secretRef:
            name: redaction-secrets
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        volumeMounts:
        - name: data
          mountPath: /app/uploads
          subPath: uploads
        - name: data
          mountPath: /app/output
          subPath: output
        - name: data
          mountPath: /app/audit_logs
          subPath: audit_logs
        livenessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 40
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 20
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: redaction-data-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: ui-service
  namespace: redaction-tool
spec:
  selector:
    app: ui
  ports:
  - port: 8501
    targetPort: 8501
  type: LoadBalancer

---
# ============================================================================
# API Deployment (FastAPI)
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: redaction-tool
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: redaction-tool:api-latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: redaction-config
        - secretRef:
            name: redaction-secrets
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "8Gi"
            cpu: "4000m"
        volumeMounts:
        - name: data
          mountPath: /app/uploads
          subPath: uploads
        - name: data
          mountPath: /app/output
          subPath: output
        - name: data
          mountPath: /app/audit_logs
          subPath: audit_logs
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: redaction-data-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: redaction-tool
spec:
  selector:
    app: api
  ports:
  - port: 8000
    targetPort: 8000
  type: LoadBalancer

---
# ============================================================================
# HorizontalPodAutoscaler - Auto-scaling
# ============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
  namespace: redaction-tool
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ui-hpa
  namespace: redaction-tool
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ui
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

---
# ============================================================================
# Ingress - External Access
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: redaction-ingress
  namespace: redaction-tool
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - redaction.example.com
    secretName: redaction-tls
  rules:
  - host: redaction.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ui-service
            port:
              number: 8501
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-service
            port:
              number: 8000
